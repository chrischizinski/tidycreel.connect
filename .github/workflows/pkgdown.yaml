# Source: https://github.com/r-lib/actions/blob/v2/examples/pkgdown.yaml
# Adapted: push to main only (no release:); workflow_dispatch included for manual redeploy
#
# Split into build and deploy (#32). Building runs package code and every
# dependency's install scripts, so it gets a read-only token; only the deploy
# job, which runs no R and never on a pull request, may write to gh-pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: pkgdown.yaml

permissions: {}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/harden-apt

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        timeout-minutes: 15
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE)
        shell: Rscript {0}

      # Hidden files included: build_site_github_pages() writes .nojekyll,
      # which upload-artifact otherwise drops, and without it GitHub Pages
      # skips every file and folder starting with an underscore.
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkgdown-site
          path: docs
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: pkgdown
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pkgdown-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # The deploy action pushes with its own `token` input (the job token by
      # default), so the checkout need not keep credentials on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
