# CSV profile template for tidycreel.connect -----------------------------------
#
# Every column name on the right-hand side below is invented. tidycreel.connect
# ships no column names for any organisation's export: those describe one
# deployment, and a built-in default would rename that export correctly while
# silently dropping every other one. Copy this file, replace the values with
# your export's, and keep it outside your analysis code:
#
#   conn <- creel_connect_from_yaml("~/.config/tidycreel/my-csvs.yml")
#
# The left-hand name in each columns entry is tidycreel's canonical name and
# must not be changed. The right-hand value is the column header in your CSV.
#
# `backend: api` ignores this block -- name raw JSON keys in field_map there,
# and see api-profile-example.yml. `backend: sqlserver` accepts it, but its
# fetch_*() methods are not implemented yet and abort when called, so nothing
# reads it today.

default:
  backend: csv

  # One path per table. All five keys are required; point the length tables at
  # an empty CSV with the right headers when the survey collected no lengths.
  files:
    interviews: "~/creel/2016/interviews.csv"
    counts: "~/creel/2016/counts.csv"
    catch: "~/creel/2016/catch.csv"
    harvest_lengths: "~/creel/2016/harvest_lengths.csv"
    release_lengths: "~/creel/2016/release_lengths.csv"

  schema:
    survey_type: instantaneous

    # What your columns are called. Map only the ones your export has: a
    # column that is neither mapped nor already named the way tidycreel names
    # it is dropped, and fetch_*() then reports it as missing. Columns your
    # export already calls by their canonical name need no entry -- the fetch
    # takes them and says so -- but declaring them states the mapping outright.
    # An entry naming a column you do not have is NOT rescued that way; it
    # stays a drop, so a typo here surfaces instead of hiding.
    # Run tidycreel::creel_schema() with no arguments to see every canonical
    # name this block accepts.
    columns:
      # Interviews
      interview_uid: "InterviewID"
      date: "SurveyDate"
      effort: "HoursFished"
      catch: "TotalCatch"
      trip_status: "TripStatus"
      n_anglers: "PartySize"
      angler_type: "AnglerType"
      # Counts -- a clerk records bank anglers, angler boats and non-angling
      # boats separately; there is no single "anglers counted" column.
      count_time: "CountTime"
      bank_anglers: "BankAnglers"
      angler_boats: "AnglerBoats"
      non_ang_boats: "NonAnglerBoats"
      # Catch
      catch_uid: "CatchUID"
      species: "SpeciesCode"
      catch_count: "CatchCount"
      catch_type: "CatchCategory"
      # Lengths
      length_uid: "LengthUID"
      length_mm: "LengthMM"
      length_type: "LengthType"

    # Which columns carry the design's strata, if your export names them
    # something other than the design does. A bare sequence says the source
    # already uses the design's name.
    # strata_cols:
    #   day_type: "DayType"

    # What YOUR codes mean. Only three columns have a fixed vocabulary -- see
    # tidycreel::creel_vocabulary(). Omit the block entirely if your source
    # already writes the canonical values.
    # value_maps:
    #   trip_status:
    #     "1": "complete"
    #     "2": "incomplete"
